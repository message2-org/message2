# Shared nginx locations for Message2.
# Install: sed "s|__MESSAGE2_ROOT__|/opt/message2|g" message2-locations.conf > /etc/nginx/snippets/message2-locations.conf

root __MESSAGE2_ROOT__/apps/site/dist;

location = /releases.json {
    try_files $uri =404;
}

location /downloads/ {
    alias __MESSAGE2_ROOT__/releases/;
    autoindex off;
}

location = /app {
    return 301 /app/;
}

location /app/ {
    alias __MESSAGE2_ROOT__/apps/web/dist/;
    try_files $uri $uri/ @message2_app;
}

location @message2_app {
    root __MESSAGE2_ROOT__/apps/web/dist;
    try_files /index.html =404;
}

location /messaging/ws {
    proxy_pass http://127.0.0.1:4001/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 86400;
}

location /messaging/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /media/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /notifications/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location / {
    try_files $uri $uri/ /index.html;
}
